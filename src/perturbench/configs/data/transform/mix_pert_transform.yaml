_target_: perturbench.data.transforms.MixPertTransform
_partial_: true
gene_key: ${data.gene_key} #从data的yaml配置同步参数
drug_key: ${data.drug_key}
env_key: ${data.env_key}
crispr_key: ${data.crispr_key}
cov_keys: ${data.cov_keys}

#扰动和协变量emb字典储存路径
crispr_map_path: null
gene_map_path: null
drug_map_path: null
env_map_path: null
cov_maps_path: null

null_token: '' #空缺的扰动值用什么代替就填什么
# use_covs: ${model.inject_covariates_encoder} #从所选的模型yaml配置同步参数
use_covs: false
use_cell_emb: true #是否使用预训练细胞嵌入
comb_delim: ${data.perturbation_combination_delimiter}

# Padded tensor 参数（适合多进程数据加载）
max_gene_perts: 2  # 最大基因扰动数（超过会截断）
max_drug_perts: 2  # 最大药物扰动数（超过会截断）