project: perturbench
name: norman_hvg_0127_squidiff_32
method: grid

metric:
  goal: minimize
  name: val_loss_epoch

parameters:
  # 固定项
  data:
    value: mix_pert
  data.n_top_hvgs:
    value: 500
  # data.task:
  #   value: srivatsantrapnell2020_sciplex3
  data.data_path:
    value: /fs-computility-new/upzd_share/maoxinjie/AIVC/mxj/perturbench-main/data/norman_hvg_emb.h5ad
  data.embedding_key:
    value: scgpt_embeddings

  train:
    value: true
  test:
    value: true

  trainer.log_every_n_steps:
    value: 10
  trainer.max_epochs:
    value: 1
  trainer.min_epochs:
    value: 0
  trainer.devices:
    value: 1

  data.val_batch_size:
    value: 32
  data.test_batch_size:
    value: 32
  data.transform.use_covs:
    value: false

  model.use_mask:
    value: false
  model.use_cell_emb:
    value: false

  data.train_batch_size:
    values: [32]

  # sweep 项（注意：model 只能是单值 categorical，不要让它变成 list）
  model:
    values: [squidiff]
    # values: [biolord, cpa, genepert, sclambda, squidiff, decoder_only, gears, latent_additive, linear_additive, prnet, sams_vae, state_sm]
  

  logger:
    value: wandb
  logger.wandb.project:
    value: perturbench
  # logger.wandb.name 会自动根据 model 名称生成，格式：{model}_lr{lr}
  # model.dropout:
  #   distribution: uniform
  #   min: 0.0
  #   max: 0.3

  model.lr:
    values: [1e-6]
    # distribution: log_uniform_values
    # min: 1e-6
    # max: 1e-3

  # Learning rate scheduler parameters (unified across all models)
  model.lr_scheduler_mode:
    value: onecycle  # Use ReduceLROnPlateau for better convergence
  # model.lr_scheduler_patience:
  #   value: 10  # Wait 10 epochs before reducing LR when val_loss stops improving
  # model.lr_scheduler_factor:
  #   value: 0.5  # Reduce LR by factor of 0.5

  # model.lr_scheduler_max_lr:
  #   distribution: log_uniform_values
  #   min: 1e-4
  #   max: 1e-2

  model.wd:
    # values: [1e-8, 1e-7, 1e-6, 1e-5, 1e-4]
    values: [1e-7]

  # Early stopping parameters
  callbacks.early_stopping.monitor:
    values: ["val_loss_epoch"]
  callbacks.early_stopping.patience:
    values: [30]

# 核心：command 里只写 program，所有超参由 wandb 通过 ${args} 注入 (--key value)

program: /fs-computility-new/upzd_share/maoxinjie/AIVC/mxj/perturbench-main/src/perturbench/modelcore/train.py
command:
  - /fs-computility-new/upzd_share/maoxinjie/miniconda3/envs/qianhong_env/bin/python
  - ${program}
  - ${args}
